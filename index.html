<script>
  const slider = document.getElementById('flipSlider');
  const amountDisplay = document.getElementById('amountDisplay');
  const districts = Array.from(document.querySelectorAll('.cls-4'));

  slider.addEventListener('input', () => {
    const amount = parseInt(slider.value, 10);
    amountDisplay.textContent = amount;

    const districtsToFlip = amount / 1000;

    districts.forEach((district, index) => {
      if (index < districtsToFlip) {
        district.style.fill = '#ff0000';
      } else {
        district.style.fill = '#2fc4f2';
      }
    });
  });
</script>
